    <script>
      // Prevent "Cannot set property fetch of #<Window> which has only a getter" errors
      // caused by third-party extensions or polyfills attempting to override fetch.
      try {
        const desc = Object.getOwnPropertyDescriptor(window, 'fetch');
        if (desc && !desc.set && desc.configurable) {
          const originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function(val) { console.warn('Ignored attempt to override window.fetch'); },
            configurable: true,
            enumerable: true
          });
        }
      } catch (e) {}
    </script>
